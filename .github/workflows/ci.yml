name: self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The gate tool gates itself on all three OSes it claims to support.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test battery
        run: python -m unittest discover -s tests -v